# Optional host access to Redis. Copy to docker-compose.override.yml (git-ignored)
# and set REDIS_URL=redis://localhost:17500/0 for host-run uvicorn.
#
# 17500 is >= 15001, outside Windows' dynamic port range (1024-15001), so
# Hyper-V/WinNAT/WSL reservations cannot steal it (they caused the 7500 bind
# failure: "excluded port range 7448-7547").
services:
  redis:
    ports:
      - "127.0.0.1:17500:6379"
---
# If WinNAT also excludes host port 8000 (range 7981-8080 on some machines),
# the api's host mapping cannot bind either. The web proxy and the api
# healthcheck stay on `api:8000` inside the Compose network, so only host
# tooling (curl, /docs) needs the new port. Append to the same override file;
# `!override` replaces the base ports list instead of appending to it:
#
# services:
#   api:
#     ports: !override
#       - "127.0.0.1:18000:8000"
