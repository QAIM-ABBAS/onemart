name: onemart

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onemart
      POSTGRES_PASSWORD: onemart
      POSTGRES_DB: onemart
    ports:
      # Host-only: required by host-run pytest (tests/conftest.py) and host uvicorn.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemart -d onemart"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Deliberately NOT published: api reaches redis:6379 on the Compose network;
    # host tooling falls back to the in-process cache (app/core/redis.py);
    # tests run with REDIS_DISABLED=true. See docker-compose.override.example.yml
    # if you ever need host access (use a port >= 15001, outside the WinNAT dynamic range).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://onemart:onemart@db:5432/onemart
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef0123456789abcdef
      COOKIE_SECURE: "false"
      SEED_ON_STARTUP: "true"
      # Host source wins over the site-packages copy created by the image's
      # `pip install --no-deps .` (uvicorn/alembic console scripts don't put
      # cwd on sys.path, so PYTHONPATH is what makes edits take effect).
      PYTHONPATH: /srv
    volumes:
      # Enables host-file hot reload: uvicorn --reload watches these dirs.
      - ./backend:/srv
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app --reload-dir /srv/alembic"

  web:
    build: ./frontend
    environment:
      # Server-side proxy target (vite.config.ts), resolved by Docker DNS inside
      # the network. The browser never sees this — it calls relative /api on :5173.
      VITE_API_BASE_URL: http://api:8000
    volumes:
      # Host source hot-reloads through Vite HMR; the named volume keeps the
      # image's Linux node_modules from being shadowed by the host's Windows
      # one (platform-specific binaries would otherwise break vite).
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  web_node_modules:
